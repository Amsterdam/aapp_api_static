name: aapp-static

# Default values
image:
  registry: saks01weuacrpgpgo5qvmwo.azurecr.io
  repository: aapp/images/static
  tag: 1.0.0

labels:
  app: static

serviceAccount: default
serviceAccounts:
  default:
      enableWorkloadIdentity: true

network:
  allow-ingress:
    selector: app == 'static'
    ingress:
      - action: Allow
    egress:
      - action: Allow

# persistentVolumeClaims:
#   data:
#     resources:
#       requests:
#         storage: 1Gi

jobs:
  certificate-init:
    annotations:
      helm.sh/hook: post-install,post-upgrade
    labels:
      component: certificate
    secrets:
      - certificate
    containers:
      - name: static
        command:
          - sleep
        args:
          - '1'

