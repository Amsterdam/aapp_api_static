deployments:
  api:
    selectorLabels:
      component: api
    securityContext:
      runAsUser: 2000
    autoscale:
      cpu: 70
      memory: 90
      min: 1
      max: 3        
    resources:
      requests:
        cpu: 1
        memory: "512Mi"
      limits:
        cpu: 2
        memory: "512Mi"
    volumes:
      - name: tmp
        spec:
          emptyDir: {}           
    containers:
      - name: main
        ports:
          - port: 8000
            name: http
        volumes:
          - name: tmp
            mountPath: /tmp


secrets:
  certificate:
    type: keyvault
    tls: aapp-cert
      
services:
  api:
    selector:
      component: api
    ports:
      - port: 8000
        targetPort: 8000


ingress:
  static-external:
    className: nginx-external
    paths:
      - path: /
        pathType: Prefix
        service: api
        port: 8000
    tls: certificate       