name: aapp-static

tenantId: 72fca1b1-2c2e-4376-a445-294d80196804

# Default values
image:
  registry: saks01weuacrpgpgo5qvmwo.azurecr.io
  repository: aapp/images/static
  tag: 1.0.0

labels:
  app: aapp-static

serviceAccount: default
serviceAccounts:
  default:
      enableWorkloadIdentity: true

network:
  allow-ingress:
    selector: app == 'aapp-static'
    ingress:
      - action: Allow
    egress:
      - action: Allow

jobs:
  certificate-init:
    annotations:
      helm.sh/hook: post-install,post-upgrade
    labels:
      component: certificate
    resources:
      requests:
        cpu: 100m
        memory: "100Mi"
      limits:
        cpu: 100m
        memory: "100Mi"      
    secrets:
      - certificate
    containers:
      - name: main
        command:
          - sleep
        args:
          - '1'


deployments:
  api:
    selectorLabels:
      component: api
    securityContext:
      runAsUser: 2000
    autoscale:
      cpu: 70
      memory: 90
      min: 1
      max: 3        
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    volumes:
      - name: cache
        spec:
          emptyDir: {}
      - name: run
        spec:
          emptyDir: {} 
      - name: log
        spec:
          emptyDir: {}                               
    containers:
      - name: main
        ports:
          - port: 8000
            name: http
        volumes:
          - name: cache
            mountPath: /var/cache/nginx
          - name: run
            mountPath: /var/run
          - name: log
            mountPath: /var/log/nginx

secrets:
  certificate:
    type: keyvault
    tls: aapp-cert
      
services:
  api:
    selector:
      component: api
    ports:
      - port: 8000
        targetPort: 8000


ingress:
  static-external:
    className: nginx-external
    paths:
      - path: /
        pathType: Prefix
        service: api
        port: 8000        
    tls: certificate
          