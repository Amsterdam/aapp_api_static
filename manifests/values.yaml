deployments:
  app:
    selectorLabels:
      component: static
    securityContext:
      runAsUser: 2000     
    resources:
      requests:
        cpu: 1
        memory: "512Mi"
      limits:
        cpu: 2
        memory: "512Mi"
    volumes:
      - name: tmp
        spec:
          emptyDir: {}           
    containers:
      - name: static
        ports:
          - port: 8000
            name: http
        volumes:
          - name: tmp
            mountPath: /tmp
        secrets:
          - vault

secrets:
  certificate:
    type: keyvault
    tls: aapp-cert
  vault:
    type: keyvault
    workloadIdentity: e8e648cd-def8-4b8a-b431-8c2460b86e67
    keyVaultName: aapp-o-bgr6li3kaefcc    
    secrets:
      - aes-secret
      
services:
  static:
    selector:
      component: static
    ports:
      - port: 8000
        targetPort: 8000


ingress:
  static-external:
    className: nginx-external
    paths:
      - path: /
        pathType: Prefix
        service: static
        port: 8000
    tls: certificate       